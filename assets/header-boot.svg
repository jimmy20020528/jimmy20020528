<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Terminal boot log ending with: Hi, I'm Jimmy Yan. AI engineer who ships products.">
<defs>
  <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .l { font-size: 17px; opacity: 0; animation-duration: 10s; animation-iteration-count: infinite; }
  .bar { font-size: 13px; fill: #8b97ab; }
  .name { font-size: 40px; font-weight: 700; }
  .sub { font-size: 15px; fill: #8b97ab; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes l0 { 0%, 3% { opacity: 0; } 5%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l1 { 0%, 12% { opacity: 0; } 14%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l2 { 0%, 21% { opacity: 0; } 23%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l3 { 0%, 30% { opacity: 0; } 32%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l4 { 0%, 39% { opacity: 0; } 41%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l5 { 0%, 50% { opacity: 0; } 52%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l6 { 0%, 58% { opacity: 0; } 60%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } .cursor { animation: none; } }
</style>
<rect x="1" y="1" width="898" height="298" rx="12" fill="#0d1117" stroke="url(#border)" stroke-width="2"/>
<circle cx="26" cy="24" r="6" fill="#ff5f57"/><circle cx="46" cy="24" r="6" fill="#febc2e"/><circle cx="66" cy="24" r="6" fill="#28c840"/>
<text class="bar" x="450" y="29" text-anchor="middle">jimmy@northeastern: ~</text>
  <text class="l" style="animation-name: l0" x="32" y="70" fill="#dce4ef"><tspan fill="#a78bfa">$</tspan> ./boot --user jimmy</text>
  <text class="l" style="animation-name: l1" x="32" y="97" fill="#8b97ab"><tspan fill="#28c840">[ ok ]</tspan> loading weights: coffee.pt (2 cups)</text>
  <text class="l" style="animation-name: l2" x="32" y="124" fill="#8b97ab"><tspan fill="#28c840">[ ok ]</tspan> mounting curiosity at /dev/brain</text>
  <text class="l" style="animation-name: l3" x="32" y="151" fill="#8b97ab"><tspan fill="#28c840">[ ok ]</tspan> shipping models into real products</text>
  <text class="l" style="animation-name: l4" x="32" y="178" fill="#8b97ab"><tspan fill="#febc2e">[warn]</tspan> hallucination check: passed (mostly)</text>
  <text class="l name" style="animation-name: l5" x="32" y="232" fill="url(#name)">&gt; Hi, I'm Jimmy Yan<tspan class="cursor" fill="#a78bfa">_</tspan></text>
  <text class="l sub" style="animation-name: l6" x="34" y="268">Applied AI @ Northeastern · I ship AI products · vision · language · data</text>
</svg>

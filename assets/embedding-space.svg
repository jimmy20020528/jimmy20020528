  @keyframes n1 { 0%, 28.0% { opacity: 0; } 32.0%, 42.5% { opacity: 1; } 44.5%, 100% { opacity: 0; } }
  @keyframes n2 { 0%, 53.0% { opacity: 0; } 57.0%, 67.5% { opacity: 1; } 69.5%, 100% { opacity: 0; } }
  @keyframes n3 { 0%, 78.0% { opacity: 0; } 82.0%, 92.5% { opacity: 1; } 94.5%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pt, .q, .ring, .nn { animation: none; } .nn:first-of-type { opacity: 1; } }
</style>
